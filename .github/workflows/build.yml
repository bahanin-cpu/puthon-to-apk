name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - run: pip install buildozer "cython<3" setuptools
      - name: Build
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ok=0
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            if buildozer android debug >> build.log 2>&1; then
              ok=1
              break
            fi
            tail -n 3 build.log | cut -c1-200
            sleep 20
          done
          tail -n 40 build.log | cut -c1-300
          ls bin || true
          [ "$ok" = "1" ]
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: bin/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log
          path: build.log
