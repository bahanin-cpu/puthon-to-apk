name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - run: pip install buildozer "cython<3" setuptools
      - name: Build
        run: |
          yes | buildozer android debug > build.log 2>&1 || true
          tail -n 60 build.log
          ls bin || true
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log
          path: build.log
